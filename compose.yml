name: 'r4.01-devapi'

services:
  nginx:
    build:
      context: .
      dockerfile: ./build/nginx/Dockerfile
    image: r4.01-devapi-nginx
    container_name: r4.01-devapi-nginx
    volumes:
      - type: bind
        source: ./sfapi 
        target: /app/sfapi
    depends_on:
      - sfapi
    ports:
      - 8000:80
    networks:
      - r4.01-devapi-network
  sfapi:
    build:
      args:
        USER_ID: ${USER_ID:-0}
        GROUP_ID: ${GROUP_ID:-0}
        USER_NAME: ${USER_NAME:-0}
        GROUP_NAME: ${GROUP_NAME:-0}
      context: .
      dockerfile: ./build/sfapi/Dockerfile
    image: r4.01-devapi-sfapi
    container_name: r4.01-devapi-sfapi
    volumes:
      - type: bind
        source: ./sfapi 
        target: /app/sfapi 
    #command: sh -c 'composer install --no-interaction --optimize-autoloader && php-fpm'
    depends_on:
      - database
    networks:
      - r4.01-devapi-network
  database:
    build:
      context: .
      dockerfile: ./build/database/Dockerfile
    image: r4.01-devapi-database
    container_name: r4.01-devapi-database
    ports:
      - 3306:3306
    volumes:
      - type: volume
        source: database-volume
        target: /var/lib/mysql
    environment:
      MYSQL_DATABASE: dbsfapi
      MYSQL_ROOT_PASSWORD: dbsfapi
      MYSQL_USER: api
      MYSQL_PASSWORD: api
    networks:
      - r4.01-devapi-network

networks:
  r4.01-devapi-network: 
    driver: bridge

volumes:
  database-volume:
    driver: local